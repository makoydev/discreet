version: 2
updates:
  # Keeps SHA-pinned Actions current; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    labels:
      - dependencies
