name: Vetted

# Vetted (https://github.com/makoydev/vetted) reviews every pull request in
# this repository. It ran in shadow mode (audit record only, no comments)
# for the first two weeks; from 2026-10-14 it is opt-in: it comments on pull
# requests labelled `ai-review` and keeps an audit record for every one.
# Pinned to the exact commit of the v0.1.0 release.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    name: Vetted review
    runs-on: ubuntu-latest
    steps:
      - name: Vetted AI Code Review
        uses: makoydev/vetted@2ae958e0fbf14fb9c74c2423059a49762927a192 # v0.1.0
        with:
          mode: opt-in
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
