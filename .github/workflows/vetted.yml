name: Vetted

# Vetted (https://github.com/makoydev/vetted) reviews every pull request in
# this repository: shadow mode (audit record only, no comments) for the
# first two weeks, until 2026-10-14, then opt-in with the `ai-review` label.
# Pinned to the exact commit of the v0.1.0 release.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    name: Vetted review
    runs-on: ubuntu-latest
    steps:
      - name: Vetted AI Code Review
        uses: makoydev/vetted@2ae958e0fbf14fb9c74c2423059a49762927a192 # v0.1.0
        with:
          mode: shadow
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
