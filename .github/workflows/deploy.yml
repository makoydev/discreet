name: Deploy demo

# Deploys the public mock-mode demo to Fly.io from main only, after
# Michael's merge. Does nothing until the FLY_API_TOKEN secret exists.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip without a Fly.io token
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set; skipping deployment (see docs/DEPLOY.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up flyctl
        if: steps.gate.outputs.run == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        if: steps.gate.outputs.run == 'true'
        run: flyctl deploy --remote-only --build-arg VERSION="${GITHUB_SHA::7}"

      - name: Smoke test the live demo
        if: steps.gate.outputs.run == 'true'
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          url="https://$app.fly.dev"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/healthz"
          out=$(curl -fsS "$url/demo/run" -H 'Content-Type: application/json' \
            -d '{"purpose":"claims summary","text":"Member S1234567D on 9123 4567"}')
          printf '%s' "$out" | grep -q '"sent_to_model":"Member <NRIC_1> on <PHONE_1>"'
          printf '%s' "$out" | grep -q '"upstream":"mock"'
          echo "Live demo OK: $url"
